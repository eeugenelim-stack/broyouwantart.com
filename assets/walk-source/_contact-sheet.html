<script>
  const KEY='walk-selection-v1';
  const figs=[...document.querySelectorAll('figure')];
  const sel=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
  const selN=document.getElementById('selN');
  const copyBtn=document.getElementById('copy'), dlBtn=document.getElementById('download'),
        clearBtn=document.getElementById('clear');
  let filter='all';

  function persist(){ localStorage.setItem(KEY, JSON.stringify([...sel])); }
  function refresh(){
    figs.forEach(f=>{
      const n=f.dataset.name; f.classList.toggle('sel', sel.has(n));
      const show = (filter==='all') || (filter==='__sel'? sel.has(n) : f.dataset.cat===filter);
      f.style.display = show ? '' : 'none';
    });
    selN.textContent=sel.size;
    [copyBtn,dlBtn,clearBtn].forEach(b=>b.disabled = sel.size===0);
  }
  function toggle(f){ const n=f.dataset.name; sel.has(n)?sel.delete(n):sel.add(n); persist(); refresh(); }
  figs.forEach(f=>{
    f.addEventListener('click',()=>toggle(f));
    f.addEventListener('keydown',e=>{ if(e.key===' '||e.key==='Enter'){e.preventDefault();toggle(f);} });
  });

  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));
    filter=b.dataset.f; refresh();
  });

  function fileText(){
    const lines=[...sel].sort();
    return '# THE WALK — curated subset ('+lines.length+' picks), exported '+new Date().toISOString().slice(0,10)+'\n'
      + '# One source filename per line; # comments ignored. Input to tools/make-lines.py\n\n'
      + lines.join('\n') + '\n';
  }
  copyBtn.onclick=()=>{ navigator.clipboard.writeText(fileText());
    copyBtn.textContent='copied!'; setTimeout(()=>copyBtn.textContent='copy filenames',1200); };
  dlBtn.onclick=()=>{ const blob=new Blob([fileText()],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='walk-selection.txt'; a.click(); };
  clearBtn.onclick=()=>{ if(confirm('Clear all '+sel.size+' selections?')){ sel.clear(); persist(); refresh(); } };

  refresh();
</script>
