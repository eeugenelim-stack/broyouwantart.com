<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300" role="img" aria-label="HACET">
  <!-- HACET primary mark: the letter H as a see-saw balanced by two working figures. -->
  <g stroke="#111" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">

    <!-- ground line -->
    <path d="M44 250 q106 11 212 0" fill="none" stroke-width="7"/>

    <!-- LEFT figure / leg of the H (blue) -->
    <path d="M70 240 q-4 -70 0 -118 q1 -8 31 -7 q4 48 0 126 q-1 6 -31 -1z" fill="#1d5fd6"/>
    <!-- left hard hat: dome + brim, sitting on the body -->
    <path d="M63 119 q23 -46 46 0z" fill="#f4c41b"/>
    <path d="M53 119 q33 -13 66 0z" fill="#f4c41b"/>

    <!-- RIGHT figure / leg of the H (red) -->
    <path d="M199 240 q-4 -70 0 -118 q1 -8 31 -7 q4 48 0 126 q-1 6 -31 -1z" fill="#e83b2c"/>
    <!-- right hard hat -->
    <path d="M192 119 q23 -46 46 0z" fill="#f4c41b"/>
    <path d="M182 119 q33 -13 66 0z" fill="#f4c41b"/>

    <!-- PLANK = crossbar of the H, tilted like a balancing see-saw -->
    <path d="M86 180 L214 152 q9 -2 9 10 q0 11 -10 12 L86 202 q-10 1 -10 -11 q0 -10 10 -11z" fill="#f4c41b"/>

    <!-- fulcrum triangle -->
    <path d="M150 170 L126 216 L174 216 z" fill="#111"/>
  </g>
</svg>
